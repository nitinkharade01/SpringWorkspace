server:
  port: 8083

spring:
  application:
    name: fraud-detection-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/payment_fraud_db
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  kafka:
    enabled: false
  redis:
    enabled: false

fraud:
  amount-threshold: 50000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

