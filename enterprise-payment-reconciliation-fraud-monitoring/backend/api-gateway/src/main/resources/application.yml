server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates: [ Path=/api/auth/** ]
        - id: transaction-service
          uri: lb://transaction-service
          predicates: [ Path=/api/transactions/** ]
        - id: fraud-detection-service
          uri: lb://fraud-detection-service
          predicates: [ Path=/api/fraud-alerts/** ]
        - id: reconciliation-service
          uri: lb://reconciliation-service
          predicates: [ Path=/api/reconciliation/** ]
        - id: notification-service
          uri: lb://notification-service
          predicates: [ Path=/api/notifications/** ]
        - id: reporting-service
          uri: lb://reporting-service
          predicates: [ Path=/api/reports/** ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-very-long-256-bit-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
