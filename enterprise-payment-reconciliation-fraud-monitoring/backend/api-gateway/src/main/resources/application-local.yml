server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
      routes:
        - id: auth-service-local
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: transaction-service-local
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**
        - id: fraud-detection-service-local
          uri: http://localhost:8083
          predicates:
            - Path=/api/fraud-alerts/**
        - id: reconciliation-service-local
          uri: http://localhost:8084
          predicates:
            - Path=/api/reconciliation/**
        - id: notification-service-local
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
        - id: reporting-service-local
          uri: http://localhost:8086
          predicates:
            - Path=/api/reports/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: local-dev-secret-key-for-payment-project-please-change
    expiration: 86400000
  redis:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

