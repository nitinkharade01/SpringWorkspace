server:
  port: 8083

spring:
  application:
    name: PERSISTENCE-SERVICE  # ← UPPERCASE for Eureka

  # MySQL (PERFECT)
  datasource:
    url: jdbc:mysql://localhost:3306/segregationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # ← Updated (MySQL8 deprecated)

  # Multi-Database (PERFECT)
  data:
    mongodb:
      uri: mongodb://localhost:27017/persistence
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # KAFKA (MISSING - ADD THIS)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: persistence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: 'com.example.*'
            value:
              default:
                type: 'com.example.common.dto.DataEvent'
      enable-auto-commit: false
    listener:
      ack-mode: manual
      concurrency: 2

# Eureka (PERFECT)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Management (PERFECT + Kafka health)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,kafka
  endpoint:
    health:
      show-details: always
      show-components: always
    kafka:
      enabled: true

# Logging (PERFECT)
logging:
  level:
    com.example.persistence: DEBUG
    org.springframework.data: INFO
    org.springframework.kafka: INFO

# App Config
app:
  kafka:
    input-topic: processed-data-topic  # From segregation
    dlq-topic: dlq-events
